{% extends 'base.html' %}
{% block title %}管理者ログイン — Gemgraphy{% endblock %}
{% block content %}
<style>
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--primary); }
  .login-card { background: white; border-radius: 12px; padding: 40px; width: 100%; max-width: 380px; }
  .login-logo { text-align: center; margin-bottom: 28px; }
  .login-logo h1 { font-size: 26px; color: var(--primary); font-weight: 700; }
  .login-logo p { color: var(--muted); font-size: 13px; margin-top: 4px; }
</style>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <h1>Gemgraphy</h1>
      <p>管理者ログイン</p>
    </div>
    {% for cat, msg in get_flashed_messages(with_categories=true) %}
    <div class="alert alert-{{ 'error' if cat == 'error' else 'success' }}">{{ msg }}</div>
    {% endfor %}
    <form method="post">
      <div class="form-group">
        <label>ユーザー名</label>
        <input type="text" name="username" required autofocus>
      </div>
      <div class="form-group">
        <label>パスワード</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px;">ログイン</button>
    </form>
    <hr class="divider">
    <p class="text-center text-muted"><a href="{{ url_for('artist_login') }}">作家様はこちら →</a></p>
  </div>
</div>
{% endblock %}
