<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Gemgraphy 販売管理{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #1a1a2e; --accent: #c9a84c; --bg: #f8f7f4; --card: #ffffff;
      --text: #2d2d2d; --muted: #6b6b6b; --border: #e0ddd8;
      --success: #2e7d32; --error: #c62828; --radius: 8px;
    }
    body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .nav { background: var(--primary); color: white; padding: 0 24px; display: flex; align-items: center; gap: 24px; height: 56px; }
    .nav-brand { font-weight: 700; font-size: 18px; color: var(--accent); }
    .nav-links { display: flex; gap: 4px; margin-left: auto; }
    .nav-links a { color: rgba(255,255,255,.8); padding: 8px 12px; border-radius: 4px; font-size: 14px; }
    .nav-links a:hover { background: rgba(255,255,255,.1); text-decoration: none; color: white; }
    .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
    .page-title { font-size: 22px; font-weight: 700; margin-bottom: 24px; color: var(--primary); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; }
    .card-title { font-size: 15px; font-weight: 700; margin-bottom: 16px; color: var(--primary); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--muted); }
    input[type=text], input[type=email], input[type=password], input[type=number], input[type=date], select, textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px;
      font-family: inherit; font-size: 14px; background: white; transition: border-color .2s;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
    textarea { resize: vertical; min-height: 80px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: 6px;
           border: none; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: all .2s; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: #2d2d52; color: white; text-decoration: none; }
    .btn-accent { background: var(--accent); color: white; }
    .btn-accent:hover { background: #b8943d; text-decoration: none; }
    .btn-outline { background: transparent; color: var(--primary); border: 1px solid var(--border); }
    .btn-outline:hover { background: var(--bg); text-decoration: none; }
    .btn-sm { padding: 6px 12px; font-size: 13px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; padding: 10px 12px; background: var(--primary); color: white; font-weight: 500; font-size: 13px; }
    td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:hover td { background: var(--bg); }
    .text-right { text-align: right; }
    .text-center { text-align: center; }
    .alerts { margin-bottom: 20px; }
    .alert { padding: 12px 16px; border-radius: 6px; margin-bottom: 8px; font-size: 14px; }
    .alert-success { background: #e8f5e9; color: var(--success); border-left: 3px solid var(--success); }
    .alert-error { background: #fce4e4; color: var(--error); border-left: 3px solid var(--error); }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 12px; font-weight: 500; }
    .badge-craft { background: #e3f2fd; color: #1565c0; }
    .badge-food { background: #fff8e1; color: #e65100; }
    .badge-sent { background: #e8f5e9; color: var(--success); }
    .badge-pending { background: #fff3e0; color: #e65100; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .stat-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .stat-value { font-size: 24px; font-weight: 700; color: var(--primary); }
    .stat-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .flex { display: flex; align-items: center; gap: 12px; }
    .flex-between { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .mt-16 { margin-top: 16px; }
    .mb-16 { margin-bottom: 16px; }
    .text-muted { color: var(--muted); font-size: 13px; }
    .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
    @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } .container { padding: 16px; } }
  </style>
  {% block extra_style %}{% endblock %}
</head>
<body>
  {% block nav %}{% endblock %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
